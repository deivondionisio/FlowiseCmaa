# Deploy no Coolify: Build Pack "Docker Compose".
# O Coolify gera o domínio (SERVICE_FQDN_*) e as senhas (SERVICE_PASSWORD_*) automaticamente.
services:
  langflow:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_LANGFLOW_7860
      - LANGFLOW_DATABASE_URL=postgresql://langflow:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/langflow
      - LANGFLOW_AUTO_LOGIN=false
      - LANGFLOW_SUPERUSER=${LANGFLOW_SUPERUSER:-admin}
      - LANGFLOW_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_LANGFLOW}
      - LANGFLOW_SECRET_KEY=${SERVICE_BASE64_64_LANGFLOWSECRET}
      - LANGFLOW_NEW_USER_IS_ACTIVE=false
      # Maria (Copilot Studio via Direct Line) - usados quando os campos do componente ficam vazios
      - MARIA_DIRECTLINE_SECRET=${MARIA_DIRECTLINE_SECRET:-}
      - MARIA_DIRECTLINE_URL=${MARIA_DIRECTLINE_URL:-}
      # SAP Datasphere - usados quando os campos do componente ficam vazios
      - DS_HOST=${DS_HOST:-}
      - DS_PORT=${DS_PORT:-443}
      - DS_USER=${DS_USER:-}
      - DS_PASSWORD=${DS_PASSWORD:-}
    volumes:
      - langflow-data:/app/langflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=langflow
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=langflow
    volumes:
      - langflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow -d langflow"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  langflow-data:
  langflow-postgres:
